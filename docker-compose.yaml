version: '2.3'
services:
  web:
    image: zoojose:latest
    container_name: ZooJose
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/ZooJose
      PDO_HOST: db
      PDO_USER: admin
      PDO_PASSWORD: 1234
    ports:
      - "8888:80"
    volumes:
      - ./:/var/www/ZooJose
    depends_on:
      - db
      - mongo
    networks:
      - dev
  db:
    image: mysql:latest
    container_name: db_zoo
    restart: always
    volumes:
      # espace memoire pour mysql
      - db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: jose
      MYSQL_DATABASE: db_zoo
      MYSQL_USER: admin
      MYSQL_PASSWORD: 1234
    ports:
      - "3306:3306"
    networks:
      - dev
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: myadminZoo
    environment:
      PMA_HOST: db
      PMA_USER: admin
      PMA_PASSWORD: 1234
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    networks:
      - dev
  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    networks:
      - dev
  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH: 0
    networks:
      - dev
volumes:
  db-data:

networks:
  dev:
