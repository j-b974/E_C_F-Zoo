stages:
  - deploy

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh git
  script:
    - echo "🔑 Ajout de la clé SSH"
    - mkdir -p ~/.ssh
    - echo "$SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
    - SSH_USER=${SSH_USER_CI:6}
    - echo "🚀 Déploiement sur le VPS"
    - ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no root@$SERVER_IP "/bin/bash -s " < deploy.sh
  only:
    - main
