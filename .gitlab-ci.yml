cache:
  paths:
    - vendor/

stages:
  - build
  - test
  - deploy

variables:
  PHP_VERSION: "8.2"  # Version de PHP à utiliser
  docker_image: "docker:stable"
  IMAGE_APP: "zoojose:latest"

build-job:
  stage: build
  image: $docker_image  # Utilisation d'une image Docker avec Docker préinstallé
  services:
    - name: docker:dind
      alias: docker
  script:
    - echo "Construction de l'image Docker"
    # Construction de l'image Docker à partir du Dockerfile
    - docker build -t $IMAGE_APP . --file Dockerfile
    # Affichage des conteneurs en cours d'exécution pour vérification
    - docker ps -a
  before_script:
    # Installez Docker Compose
    - apk update && apk add docker-compose
    # Configurez Docker-in-Docker pour permettre l'exécution de Docker Compose
    - docker-compose version
    # Démarrage des services avec Docker Compose
  after_script:
    - docker-compse up -d
    - docker exec ZooJose ls -al vendor
  artifacts:
    paths:
      - .docker/

test-job:
  stage: test
  image: $docker_image  # Utilisation d'une image Docker avec Docker préinstallé
  services:
    - name: docker:dind
      alias: docker
  script:
    - echo "Tests de l'application !"
    # teste la version de docker
    - docker ps -a 
    - docker exec ZooJose ls -al vendor
    # lancement des testes
    - docker exec ZooJose php ./vendor/bin/phpunit tests
  before_script:
    # Installez Docker Compose
    - apk update && apk add docker-compose
    # Configurez Docker-in-Docker pour permettre l'exécution de Docker Compose
    - docker-compose version
    # Démarrage des services avec Docker Compose
    - docker-compose up -d


deploy-job:
  stage: deploy
  script:
    - echo "Déploiement de l'application"  # Ajoutez les commandes de déploiement ici
    # Exemple: déploiement sur un serveur distant avec SSH
    - ssh user@server "cd /path/to/app && git pull origin master"
    # Ajoutez d'autres commandes de déploiement ici
  environment:
    name: production
    url: https://example.com  # URL de l'environnement de production
